plugins {
    id 'com.android.application'
}

android {
    namespace 'com.malbers.fixmyrips'
    compileSdk 34

    defaultConfig {
        applicationId 'com.malbers.fixmyrips'
        minSdk 26
        // 29 keeps legacy file access working on Android 11 streamers such as the Eversolo DMP-A6.
        targetSdk 29
        versionCode 2
        versionName '0.1.0-test2'
        buildConfigField 'String', 'USER_AGENT', "\"FixMyRips/${versionName} ( https://youtube.com/@malbers )\""
    }

    buildFeatures { buildConfig true }

    // The release key lives outside the repo (made by scripts/new-signing-key.ps1). Without it, release
    // builds fall back to the debug key, which is fine for testing and must never be shared.
    def signingProps = new File(System.getProperty('user.home'), '.claude/.secrets/fixmyrips-signing.properties')
    signingConfigs {
        release {
            if (signingProps.exists()) {
                def p = new Properties()
                signingProps.withInputStream { p.load(it) }
                storeFile file(p.getProperty('storeFile'))
                storePassword p.getProperty('storePassword')
                keyAlias p.getProperty('keyAlias')
                keyPassword p.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingProps.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    // Sideloaded, never on Play: the Play target-SDK floor doesn't apply.
    lint { disable 'ExpiredTargetSdkVersion' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    // The platform's org.json is a stub on the JVM; tests need the real one.
    testImplementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.2'
}
